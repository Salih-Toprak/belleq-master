# Production overrides — use with base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Qdrant is not published to the host; Caddy terminates TLS on 443 and proxies to the master API.

services:
  qdrant:
    ports: []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  master:
    ports: []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: belleq-caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - master
    networks:
      - belleq-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
