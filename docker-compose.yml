services:
  ollama:
    image: ollama/ollama:latest
    container_name: belleq-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama   # reuse existing volume with models
    networks:
      - belleq-net
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: belleq-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - belleq-net
    restart: always

  master:
    build: .
    container_name: belleq-master
    ports:
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - ollama
    networks:
      - belleq-net
    restart: on-failure

networks:
  belleq-net:
    name: belleq-net

volumes:
  qdrant_data:
    external: true
    name: chatbot_qdrant_data
  ollama_data: 
    external: true
    name: chatbot_ollama_data
