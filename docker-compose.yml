services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: belleq-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - belleq-net
    restart: always

  master:
    # Published by CI to GHCR. `docker compose pull` fetches this image;
    # `docker compose up --build` (local dev) rebuilds and tags it.
    image: ghcr.io/salih-toprak/belleq-master:latest
    build: .
    container_name: belleq-master
    ports:
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Docker-out-of-Docker: lets the master provision user containers on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - qdrant
    networks:
      - belleq-net
    restart: on-failure

networks:
  belleq-net:
    name: belleq-net

volumes:
  qdrant_data:
