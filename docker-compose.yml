services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: belleq-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - belleq-net
    restart: always

  master:
    build: .
    container_name: belleq-master
    ports:
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Docker-out-of-Docker: lets the master provision user containers on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - qdrant
    networks:
      - belleq-net
    restart: on-failure

networks:
  belleq-net:
    name: belleq-net

volumes:
  qdrant_data:
